name: Daily Draft Generator

on:
  schedule:
    # 1일 3회 (한국 시간 기준 아침 08:00 / 점심 12:30 / 저녁 19:30)
    - cron: '0 23 * * *'
    - cron: '30 3 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch: # 언제든 수동 실행 가능 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필수 패키지 설치
        run: pip install -r automation/requirements.txt

      - name: 초안 작성 및 텔레그램 전송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/generate_draft.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "부업노트 자동발행봇"
          git config user.email "bot@budeobnote.local"
          git add drafts/
          git diff --cached --quiet || git commit -m "📝 일일 자동 초안 생성"
          git push